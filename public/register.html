<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Register — SkillPilot</title>
  <link rel="stylesheet" href="/css/app.css">
</head>
<body data-page="register">
  <div class="auth-shell">
    <section class="card auth-card">
      <h1>Create account</h1>
      <form id="register-form" novalidate>
        <label for="username">Username</label>
        <input id="username" required minlength="3" maxlength="40" pattern="[A-Za-z0-9_]+">
        <label for="email">Email</label>
        <input id="email" type="email" required>
        <label for="password">Password (8+ chars, letter + number)</label>
        <input id="password" type="password" required minlength="8">
        <div id="form-error" class="banner err hidden"></div>
        <div id="form-ok" class="banner hidden"></div>
        <div class="btn-row">
          <button class="btn" type="submit">Register</button>
          <a class="btn secondary" href="/login">Back to sign in</a>
        </div>
      </form>
    </section>
  </div>
  <script src="/js/api.js"></script>
  <script src="/js/shell.js"></script>
  <script src="/js/register.js"></script>
</body>
</html>
